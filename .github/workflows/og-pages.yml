# Страницы-превью коротких адресов (…/dogruz/<адрес>/) для WhatsApp/Telegram.
name: og-pages
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/og_pages.py', '.github/workflows/og-pages.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: og-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate pages
        env:
          VZ_OG_TOKEN: ${{ secrets.VZ_OG_TOKEN }}
        run: python3 tools/og_pages.py
      - name: Commit if changed
        run: |
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name=vezu-bot -c user.email=avtomaster24bot-lab@users.noreply.github.com commit -m "og: обновить превью коротких адресов"
          git pull --rebase -q && git push
